# Privacy Shield Configuration Example
# This file demonstrates how to configure differential privacy parameters
# for different columns in your dataset.

# Global privacy budget (epsilon) - higher values = less privacy but more utility
global_epsilon: 1.0

# Optional: set a fixed random seed for reproducible anonymization runs.
# Remove this line (or set to null) for non-deterministic output.
# random_seed: 42

# Column-specific configurations
# Each column can have its own privacy parameters.
#
# IMPORTANT: For a FORMAL epsilon-DP guarantee on numeric/monetary columns,
# always declare 'min' and 'max' bounds. The sensitivity is then computed as
# (max - min), which is the true L1 sensitivity of the identity query.
# Without these bounds the tool uses a heuristic (sample range) which is NOT
# a provable DP bound.
columns:
  # Age column - formal DP guarantee via min/max bounds
  age:
    method: bounded_laplace
    epsilon: 0.2
    min: 0              # Formal sensitivity = max - min = 120
    max: 120

  # Purchase amount - formal DP guarantee via declared bounds
  purchase_amount:
    method: laplace
    epsilon: 0.4
    min: 0.0            # Formal sensitivity = 10000 - 0 = 10000
    max: 10000.0

  # Login count - integer counts
  login_count:
    method: discrete_laplace
    epsilon: 0.2

  # Boolean activity flag
  is_active:
    method: randomized_response
    epsilon: 0.5

  # Days since last login - treated as count
  last_login_days:
    method: discrete_laplace
    epsilon: 0.3

# Notes:
# - Epsilon values should sum to less than global_epsilon
# - Lower epsilon = more privacy (more noise)
# - Higher epsilon = less privacy (less noise, better utility)
# - If no column config is provided, epsilon is split equally
# - String columns (name, location, gender) are masked, not DP-anonymized
# - Use 'min'/'max' on numeric columns for a formal DP proof